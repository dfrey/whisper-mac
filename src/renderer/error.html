<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhisperMac Error</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        padding: 12px;
        color: #202124;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
      }
      .panel {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 12px;
        background: rgba(250,250,252,.96);
        box-shadow: 0 10px 36px rgba(0,0,0,.2);
      }
      header {
        flex: 0 0 auto;
        padding: 18px 20px 12px;
        font-size: 15px;
        font-weight: 650;
        -webkit-app-region: drag;
      }
      main {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0 20px;
        padding: 12px;
        overflow: auto;
        border: 1px solid rgba(0,0,0,.1);
        border-radius: 7px;
        background: rgba(255,255,255,.72);
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
      footer {
        display: flex;
        flex: 0 0 auto;
        justify-content: flex-end;
        padding: 14px 20px 18px;
      }
      button {
        min-width: 76px;
        padding: 7px 14px;
        border: 1px solid rgba(0,0,0,.18);
        border-radius: 7px;
        color: #202124;
        background: linear-gradient(#fff, #e9e9ed);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.12);
        font: inherit;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:hover { background: linear-gradient(#fff, #dedee4); }
      button:active { box-shadow: inset 0 1px 3px rgba(0,0,0,.2); }
      button:focus-visible { outline: 2px solid #007aff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <section class="panel" role="alertdialog" aria-labelledby="error-title" aria-describedby="error-description">
      <header id="error-title">Error</header>
      <main id="error-description"></main>
      <footer><button id="ok-button" type="button">OK</button></footer>
    </section>
    <script>
      const title = document.getElementById("error-title");
      const description = document.getElementById("error-description");
      const button = document.getElementById("ok-button");
      let actions = ["ok"];
      window.errorAPI.onData((payload) => {
        title.textContent = payload.title || "Error";
        description.textContent = payload.description || "";
        actions = Array.isArray(payload.actions) && payload.actions.length ? payload.actions : ["ok"];
        button.textContent = actions.includes("settings") ? "Open Settings" : actions.includes("later") ? "Later" : "OK";
        requestAnimationFrame(() => { description.scrollTop = 0; });
      });
      button.addEventListener("click", () => window.errorAPI.act(actions.includes("settings") ? "settings" : actions.includes("later") ? "later" : "ok"));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" || event.key === "Enter") window.errorAPI.act("ok");
      });
    </script>
  </body>
</html>
